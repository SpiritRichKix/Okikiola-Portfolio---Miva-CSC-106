
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Computer laboratory network</title>
  <desc id="desc">A central network switch connects several computers in a laboratory.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8efff"></stop>
      <stop offset="1" stop-color="#d9f4f1"></stop>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315bea"></stop>
      <stop offset="1" stop-color="#13a6a6"></stop>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="28" fill="url(#bg)"></rect>

  <circle cx="400" cy="230" r="165" fill="#ffffff" opacity=".35"></circle>

  <!-- Network connections -->
  <g fill="none" stroke="#315bea" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 11">
    <path d="M400 255 L180 115"></path>
    <path d="M400 255 L620 115"></path>
    <path d="M400 255 L180 375"></path>
    <path d="M400 255 L620 375"></path>
  </g>

  <!-- Central switch -->
  <rect x="310" y="205" width="180" height="100" rx="18" fill="#152238"></rect>
  <rect x="328" y="224" width="144" height="45" rx="9" fill="#253b5b"></rect>

  <g fill="#55d3cf">
    <circle cx="345" cy="246" r="5"></circle>
    <circle cx="369" cy="246" r="5"></circle>
    <circle cx="393" cy="246" r="5"></circle>
    <circle cx="417" cy="246" r="5"></circle>
    <circle cx="441" cy="246" r="5"></circle>
    <circle cx="465" cy="246" r="5"></circle>
  </g>

  <text x="400" y="288" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">NETWORK SWITCH</text>

  <!-- Computer function -->
  <g>
    <!-- Top left -->
    <rect x="105" y="65" width="150" height="95" rx="10" fill="#ffffff"></rect>
    <rect x="115" y="75" width="130" height="72" rx="5" fill="url(#screen)"></rect>
    <path d="M180 160 V175 M145 175 H215" stroke="#152238" stroke-width="7" stroke-linecap="round"></path>
    <circle cx="180" cy="111" r="15" fill="#ffffff" opacity=".85"></circle>
    <path d="M171 111 L177 117 L190 103" fill="none" stroke="#315bea" stroke-width="4"></path>

    <!-- Top right -->
    <rect x="545" y="65" width="150" height="95" rx="10" fill="#ffffff"></rect>
    <rect x="555" y="75" width="130" height="72" rx="5" fill="url(#screen)"></rect>
    <path d="M620 160 V175 M585 175 H655" stroke="#152238" stroke-width="7" stroke-linecap="round"></path>
    <path d="M585 111 H655 M585 123 H635" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"></path>

    <!-- Bottom left -->
    <rect x="105" y="325" width="150" height="95" rx="10" fill="#ffffff"></rect>
    <rect x="115" y="335" width="130" height="72" rx="5" fill="url(#screen)"></rect>
    <path d="M180 420 V435 M145 435 H215" stroke="#152238" stroke-width="7" stroke-linecap="round"></path>
    <path d="M155 360 H205 M155 375 H195" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8"></path>

    <!-- Bottom right -->
    <rect x="545" y="325" width="150" height="95" rx="10" fill="#ffffff"></rect>
    <rect x="555" y="335" width="130" height="72" rx="5" fill="url(#screen)"></rect>
    <path d="M620 420 V435 M585 435 H655" stroke="#152238" stroke-width="7" stroke-linecap="round"></path>
    <circle cx="620" cy="371" r="17" fill="none" stroke="#ffffff" stroke-width="5"></circle>
    <path d="M610 371 L617 378 L632 361" fill="none" stroke="#ffffff" stroke-width="4"></path>
  </g>

  <g fill="#315bea">
    <circle cx="400" cy="255" r="9"></circle>
  </g>
</svg>
